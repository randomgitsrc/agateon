# agate/rules/phases.yaml — 阶段定义权威源（TAG0021 M0，数据面）
#
# 数据边界（P2-design §3.1）：YAML 只承载可判定规则（阶段 id/名称/执行角色/产出/门槛/
# 重试上限/机器字段声明）；阶段叙事（为什么存在/注意事项/散文式口径）留 md（WORKFLOW.md、
# phase-cards/*.md）。
# 事实基线：阶段集与名称 = WORKFLOW.md《P1-P8 阶段总览》表（287-299 行）；retry_cap 与
# agate_common.MAX_RETRY_MAP 一致（P8=2/P6.5=2 等）；task_fields 与 agate-frontmatter-check.py
# 的 SCHEMAS migrated_keys 及 P2/P4 卡片机器字段声明一致。
# 一致性 gate：check-structure-consistency.py S-1（YAML→md）/S-2（md→YAML）以本文件为
# YAML 侧锚点；check-yaml-schema.py S-5 校验本文件过 schema。

schema_version: 1
# gate_pass_exit：每 phase 声明的「检查通过」出口码（值 ∈ {0, 2}，TAG0027 BDD-26）。
#   语义（P2 §3.1 实证，CRITICAL-1 修正）：check-gate.py 的 exit 2 是多数 phase（P0-P3/P5/P6/P8）
#   的正常通过码（gate_p0 L577 / p1 L698 / p2 L883 / p3 L892 / p5 L1048 / p6 L1093 / p8 L1376
#   return 2 实证），exit 0 是 P4/P7/P6.5 的通过码（p4 L990 / p7 L1241 / p65 L1110/1120 return 0）。
#   agate-next.py 按 pass_set 三态消费：exit ∈ gate_pass_exit → 直推（exit 2 正常通过不落盘
#   resolution）；exit 1 → retreat 委托；exit ∉ pass_set 且 ≠ 1（真暂停/异常）→ 才落盘
#   {phase}-exit2-resolution.md。P6 的 exit 2 ∈ pass_set 为条件式推进（前置 gate_p65 裁决）。
phases:
  - id: P0
    name: 任务简报
    exec_role: main-agent
    outputs:
      - {file: P0-brief.md, required: true}
    gates:
      - {check: "P0-brief.md 完成，含 debug_env + known_risks"}
    retry_cap: 3
    task_fields: []
    next: P1
    retreat: null
    gate_pass_exit: 2
  - id: P1
    name: 需求基线
    exec_role: analyst
    outputs:
      - {file: P1-requirements.md, required: true}
      - {file: P1-review.md, required: true, status_field: status}
    gates:
      - {check: "P1-requirements.md 存在且含 BDD；P1-review.md status == approved"}
      - {check: "check-gate.py P1 $TASK_DIR"}
    retry_cap: 3
    task_fields: [risk_level, phases, packages, domains]
    next: P2
    retreat: null
    gate_pass_exit: 2
  - id: P2
    name: 方案设计层
    exec_role: architect
    outputs:
      - {file: P2-design.md, required: true}
      - {file: P2-review.md, required: true, status_field: status}
    gates:
      - {check: "P2-review.md status == approved；四字段齐全（packages/domains/ui_affected/gate_commands）"}
      - {check: "check-gate.py P2 $TASK_DIR"}
      - {check: "gate_commands.P3 可选声明（供 check-tdd-red.py 自动读取测试运行器）"}
    retry_cap: 3
    task_fields: [candidate_count, packages, domains, ui_affected, gate_commands]
    next: P3
    retreat: null
    gate_pass_exit: 2
  - id: P3
    name: 测试设计
    exec_role: test-designer
    outputs:
      - {file: P3-test-cases.md, required: true}
    gates:
      - {check: "check-tdd-red.py exit 0（测试先于实现，真红灯）"}
      - {check: "check-gate.py P3 $TASK_DIR（P3-test-cases.md 存在）"}
      - {check: "check-tdd-red.py $TASK_DIR exit 0；gate_commands.P3 声明测试运行器（可选）"}
    retry_cap: 2
    task_fields: [test_code_dir]
    next: P4
    retreat: null
    gate_pass_exit: 2
  - id: P4
    name: 代码实现
    exec_role: implementer
    outputs:
      - {file: P4-implementation.md, required: true}
      - {file: P4-review.md, required: true, status_field: status}
    gates:
      - {check: "暂存区含非 md/yaml 代码文件（git diff --cached --name-only）"}
      - {check: "check-gate.py P4 $TASK_DIR"}
    retry_cap: 3
    task_fields: [implementation_dir]
    next: P5
    retreat: null
    gate_pass_exit: 0
  - id: P5
    name: 技术验证
    exec_role: verifier
    outputs:
      - {file: P5-test-results/unit.md, required: true}
    gates:
      - {check: "P2 声明的验证命令全部 exit 0 AND failed==0"}
      - {check: "check-gate.py P5 $TASK_DIR"}
    retry_cap: 2
    task_fields: []
    next: P6
    retreat: P4
    gate_pass_exit: 2
  - id: P6
    name: 验收
    exec_role: verifier
    outputs:
      - {file: P6-acceptance.md, required: true}
    gates:
      - {check: "check-gate.py P6 exit 2 + check-p6-evidence.py / check-p6-provenance.py exit 0/2（2 = 协作规范 WARNING[缺 agent 字段]，不阻塞；exit 1 硬阻）"}
      - {check: "check-p6-format.py --fix 归一化（verifier 产出后、gate 前）"}
      - {check: "check-gate.py P6.5 $TASK_DIR（= check-judge-verdict.py + check-events.py 双 exit 0；历史任务自动跳过）"}
    retry_cap: 2
    task_fields: [pass, fail, ui_affected]
    next: P7
    retreat: P4
    gate_pass_exit: 2
  # 注：P6.5 是挂载于 P6→P7 转移的强门槛子阶段，不是与 P0-P8 平级的独立 phase 值
  # （.state.yaml 的 phase 字段保持 P6 直至 P7）；本条目结构化声明其产出/门槛/重试上限，
  # 供 check-gate.py P6.5 分发与 CLI 调用，口径详见 state-machine.md「状态机定义」节。
  # P6.5 非独立转移边 → 不写 next/retreat，用 gate_subphase 表达非独立门槛形态
  # （hosted_on: .state.yaml phase 保持 P6 直至 P7（state-machine.md:74-78）；
  #  forward_to: judge 通过 → P7；needs_revision_to: needs-revision → P6 重验（judge 轮次 ≤2））。
  - id: P6.5
    name: 独立 Judge 复核
    exec_role: judge
    outputs:
      - {file: P6.5-judge-verdict.md, required: true}
    gates:
      - {check: "check-judge-verdict.py + check-events.py exit 0"}
      - {check: "check-gate.py P6.5 $TASK_DIR"}
    retry_cap: 2
    task_fields: [status, criteria_total, criteria_passed, verdict_evidence]
    gate_subphase:
      hosted_on: P6
      forward_to: P7
      needs_revision_to: P6
    gate_pass_exit: 0
  - id: P7
    name: 一致性检查
    exec_role: consistency-reviewer
    outputs:
      - {file: P7-consistency.md, required: true}
    gates:
      - {check: "[BLOCKER] 与 [DEVIATION-CRITICAL] 计数 = 0"}
      - {check: "check-gate.py P7 $TASK_DIR"}
    retry_cap: 2
    task_fields: [blocker_count, deviation_count, deviation_critical_count, design_gap_count, design_gap_reviewed_count]
    next: P8
    retreat: null
    gate_pass_exit: 0
  - id: P8
    name: 发布准备
    exec_role: implementer
    outputs:
      - {file: P8-release.md, required: true}
    gates:
      - {check: "check-gate.py P8 + gate_commands 逐包 exit 0"}
      - {check: "check-gate.py P8 $TASK_DIR：bump_type/debt_check 字段 + version/CHANGELOG/tag 检查"}
      - {check: "check-p6-provenance.py --audit7-only $TASK_DIR 判定 P5 证据复用；gate_commands.P5 逐包 exit 0 + failed==0"}
      - {check: "gate_commands.P5 链路含 check-protocol-consistency.py 时先 tag 后重跑（DEBT0013）"}
    retry_cap: 2
    task_fields: [bump_type]
    next: null
    retreat: null
    gate_pass_exit: 2