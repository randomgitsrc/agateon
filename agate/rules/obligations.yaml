# agate/rules/obligations.yaml — 阶段义务三态归宿登记表（TAG0042 批6，BDD-13/18/19）
#
# 重新盘点口径（详见 agate-workspace/tasks/TAG0042-config-and-enforcement/P4-implementation-batch6.md）：
#   外部审计的「160 项逐条清单」不在仓库（P0-brief §四已确认），本表按 P0-brief fallback
#   「没有就得重新盘点」从协议本体重新盘点。每条义务带**可追溯来源锚点**（文件 + 节/键），
#   不编造：每条都能指回协议原文（WORKFLOW.md / phase-cards/*.md / rules/*.md /
#   dispatch-protocol.md / state-machine.md / rules/phases.yaml）。
#
# 三态归宿：
#   M = 脚本执行（脚本在不可绕开路径上执行：pre-commit hook / check-gate.py / check-*.py 门禁）
#   C = 命令生成（有可判定命令但依赖主 Agent 记得运行，不在必经路径上）
#   R = 强制评审（判断类义务，由强制独立评审承载；脚本强制的是「该评审必须出现」而非其内容）
#
# 字段：
#   id           义务编号（OBL-<阶段>-NN / OBL-X-NN 横切）
#   phase        归属阶段（P0..P8 / P6.5 / X 横切）
#   statement    义务陈述（人可读）
#   anchor       可追溯来源锚点（文件#节 / rules/phases.yaml#键）
#   disposition  三态归宿（M / C / R）——不得为空，空即「无归宿」
#   script       现有脚本（如有；无则空串）
#   evidence     失败证据（如有；来自 AGENTS.md / WORKFLOW.md / P0-brief 记录的实测事故）
#
# 平台无关：本文件属数据面（CHECK 15 扫描面），不得出现平台名/平台工具名——
# 具体词表由 check-protocol-consistency.py 的平台词表维护，本文件不复述（复述即命中）。

schema_version: 1

# 基线：引入登记表时的 M 类占比（只增不减；下降即 check-obligations.py 判失败，BDD-19）。
# m / total 用整数交叉相乘比对（current_m * baseline_total >= baseline_m * current_total），
# 避免浮点舍入。m_ratio 仅供人读。
baseline:
  m: 60
  total: 123
  m_ratio: 0.4878
  note: "TAG0042 批6 首次登记基线（从协议本体重新盘点口径；M60/C33/R30）"

