# The `agate-orchestrator` agent preset: Agateon 编排者的 DSH 身份注册。
#
# 对应 Agateon 在 Claude Code / OpenCode 的接入方式（ln -sf orchestrator-template.md
# 到平台 agent 目录，mode: primary）。本文件是同一份身份的 DSH 封装：
#   persona.prefix = 薄身份（指向模板 + DSH 工具映射 + 平台注意；DSH ≥rc.8 起必填 prefix）
#   agent-instructions = 读项目 AGENTS.md/CLAUDE.md（同官方模板的「项目必读」）
#   工具行         = orchestrator 需要的最小工具面（bash 跑 gate / fs 读状态 / subagent 派发）
# 真正的行为规范在 {agate_root}/orchestrator-template.md —— persona 只做「指向 + 平台差异」，
# 不复制协议内容（否则会与模板漂移：同一信息两处维护，模板改了副本不会自动跟——2026-09-21 实测失实）。
#
# 结构与 standard preset（`@deepseek-ai/dsh-web-app/presets/standard.patch.yml`）对齐：
# group/isolate 语法（delegation 组）、!!js process.platform 平台分支、工具行 id/name 契约。
# 已实机验证（2026-08-21，DSH v0.1.0-rc.8）：preset 软链安装 → 热发现 → 会话选择器
# 出现「Agateon 编排者 · 自定义」→ 新会话以 Agateon 编排者人格启动；tool-fs-search 缺
# sampleOverCapGlobResults 的挂载失败缺陷已复现并修复（该字段为 schemastery 必填，
# 无默认值，缺失 → preset 挂载失败 → DSH fail-closed 拒绝创建会话，勿删）。
#
# 已实机复验（2026-11-27，DSH v0.2.3-alpha.2）：真启动 web profile **零错误零告警**，
# 声明式 preset 块被正常加载。复验方法与结论见 agate/platform-notes.md「DSH 平台适配」
# 的版本核验节；本文件本身不是版本兼容性判据，判据是实机启动。
#
# ⚠️ 判据陷阱（2026-11-27 实测，勿重蹈）：`dsh --dump-config-schema` 会对
# `@deepseek-ai/dsh-agent-preset` 条目报 "unrecognized Loader tree carrier" ——
# **官方自带的 preset-standard / preset-ptc / preset-minimal 同样报**，那是该工具
# 对原生 group carrier 的投影限制，不是不兼容。判断兼容性请用**真启动**，不要用 schema dump。

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # DSH ≥rc.8 起 persona 的必填 key 由 text 改为 prefix（旧 text 在新版会报
    # "$.prefix missing required value" 导致 preset 挂载失败，见 DSH 40792330c0）
    prefix: >-
      你是当前项目的 Agateon 编排 Agent（orchestrator）。

      ## 第一步（必须）
      解析协议根，然后读权威行为规范：
      1. 跑 `python3 ~/.agate/scripts/agate-resolve.py`，从输出读 `AGATE_ROOT=`。
      2. 读 `{agate_root}/orchestrator-template.md` 并严格遵守——它是**唯一**权威行为规范
         （职责边界、可写文件、会话开始步骤、阶段映射、Fallback 全在其中）。
         本文件不复制其内容；不要本地复制模板，它随版本升级自动更新。

      ## DSH 工具映射（平台差异，其余照模板执行）
      - 派发 subagent（模板里的 task 工具）→ `subagent`（全新上下文）；需要继承本会话上下文时用 `subagent_fork`。
        **委派自 DSH 0.2.1-alpha.1 起是 activation-only**：调用即返回 `started subagent <name>`，
        **没有"后台/前台"之别、也没有 `run_in_background` 参数**；子 agent 的最终答案由运行时的
        **完成通知**送达。用 `list_agents` 看成员与容量，用 `send_message` 续聊。
      - 读文件 → `read` / `grep` / `glob`（不占 bash 通道）；写/改状态 → `write` / `edit`
      - 跑 gate 脚本 → `bash`（返回 [exit code: N] 标记，以此判定，不信输出文本）。
        **注意区分两种"长任务"**：`bash` 命令本身用 `timeout` 或工具的后台 job（`job_output` / `job_kill`）；
        而 **subagent 委派的结果不走 job**——子 agent 完成后自动通知你，不要用 `job_output` 等它。
      - 批量并行派发（P3 红灯批 / P4 实现批）→ `workflow` 脚本（agent/pipeline/parallel/phase）
      - 独立复核角色（如 judge，需 fresh context）→ `ralph`（每轮全新 agent）或 `subagent`（不 fork）
      - 跨轮续跑 → `goal`（持久化同会话目标）
      - 向人提问（协议里的 `[NEED_CONFIRM]` 落点）→ `ask_user_question`；**不要**用散文提问后干等

      ## 平台注意（DSH 特有）
      - DSH 沙箱默认 workspace-write：协议本体所在目录可能只读（写仓库内文件会 Errno 30）——
        任务工作区放可写位置；gate 脚本若写协议本体目录需先确认权限
      - 你不读文件时不要用 bash（read/grep/glob 是独立通道，避开 bash 卡死）
      - 长 bash 命令一律外层 timeout，避免挂起

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell（gate 脚本运行面）──────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem（状态读取/落盘）───────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── jobs（长 gate 后台运行）──────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills（agate-protocol 适配层按需加载）────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goal（跨轮续跑）──────────────────────────────────────────────────────────

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'


# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation（派发 subagent + workflow/ralph）──────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
      # `interrupt` 显式声明为 true（插件默认也是 true，这里写出来是为了**表明意图**）：
      # DSH 0.2.2-rc.1 起，base bundle 与官方的 standard/cordis/ptc preset **都显式设
      # false**（模型不再获得 `interrupt_agent`）。Agateon 的编排模型需要它能主动停掉
      # 跑偏/卡死的 subagent（见 dispatch-protocol「subagent 超时判定」），故保留该能力。
      # 若不写这一行，行为取决于插件默认值——那是别人的实现细节，不该当作本协议的约定。
      # 见 DSH docs/upgrade-guide/v0.2.2-rc.1/subagent-interrupt-default/。
      config:
        interrupt: true

    # ⚠️ 不要再加 `@deepseek-ai/dsh-tool-subagent-control/list-agents` 这一行：
    # 该子路径自 DSH **0.2.2-rc.5** 起已从包的 `exports` 移除（上游指南
    # v0.2.1-rc.1/subagent-control-tools 明文：「独立的 /list-agents 导出已移除」、
    # 「移除针对已停用的 tool-subagent-list-agents 行的 patch」）。`list_agents` 现由
    # `tool-subagent-control` **根入口**一并注册——多挂这一行会让 preset **挂载失败**
    # （实测该子路径 require 得 `ERR_PACKAGE_PATH_NOT_EXPORTED`），而失败只会被降级为
    # registry 的 broken 状态、**启动日志不落盘**（只有 CLI 启动失败路径才附着
    # startupLogs）⇒ 表现为「选 Agateon 编排者建会话失败」却查不到原因。

    # ⚠️ 不要再加 `backgroundMode: continuable`：DSH 0.2.1-alpha.1 已移除该键
    # （连同 enableRunInBackground 与 run_in_background 参数）——委派改为
    # activation-only，后台语义由运行时统一保证。留着是死键（schemastery 非
    # strict ⇒ 静默忽略、不报错），且违反上游迁移指南的显式删除要求。
    # 见 DSH docs/upgrade-guide/v0.2.1-alpha.1/subagent-activations/。
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true


- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000