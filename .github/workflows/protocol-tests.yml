name: Protocol Tests

# docs-only PR 与 required checks 的修复史（两次实证，勿再想当然）：
#
# ① 2026-08-25 PR #194：原 paths-ignore 让 docs-only PR 跳过整个 workflow → 6 个 required
#    checks（pytest×2/shellcheck×2/consistency/gate-backstop）无 check-run → 分支保护按
#    "pending" 处理 → 永久 BLOCK（PR #193 实证 "6 of 6 required status checks are expected"）。
#    修法：去 paths-ignore，改 detect-docs-only job + 全量 job 用 job 级 if 条件跳过。
#
# ② 2026-08-25 PR #203 实证①的修法也没解决：job 级 if 跳过 → check conclusion="skipped"，
#    而 GitHub 分支保护对 skipped 的 required check 同样 BLOCK（mergeable_state="blocked"）。
#    此前注释声称"skipped 视为成功"系错误假设，从未被真实 docs-only PR 验证过。
#
# ③ 本次修法（当前实现）：required job 不再有 job 级 if——job 始终运行，把 docs-only 判断
#    内嵌进各检查 run step 开头（docs_only=true 时 echo + exit 0 → job conclusion="success"），
#    分支保护即满足。
#    platform-scan/ruff 非 required，保留 job 级 if 跳过（不阻塞合并）。
#    代价：docs-only 时各 job 仍会走 checkout/setup（约 20-40s），换取 required check success。
#    ⚠️ 2026-10-05 更正（TAG0042 批0 m-3）：分支保护实际 required = **5** 个
#      （pytest×2 / shellcheck×2 / consistency）；**gate-backstop 已移出 required**
#      （一个永远不失败的必过检查是假保障，见 X3）。本条原标题写"4 个 required job
#      （…/gate-backstop）"已过期；实际设置以 `gh api .../branches/main/protection` 为准。
#
# ④ 2026-08-26 修"docs/site 改动仍跑全量"的隐性 bug（完整机理见
#    docs/guides/ci-docs-only-playbook.md）：
#    - 病根：git-to-pr 建新分支的 push，`github.event.before` 是全零（0000...0，GitHub 对
#      新建分支的约定）→ detect-docs-only 里 `git merge-base 0000... <head>` 失败 →
#      MERGE_BASE 空 → 按 fail-closed 保守回退 docs_only=false → 连纯 docs/site 的 push run
#      也跑全量 pytest（PR #218 实证：push run pytest=1m vs pull_request run=0m）。
#    - 修法：detect-docs-only 对 push 事件检测到全零 before 时，回退 diff 对 origin/main
#      （= "分支相对 main 改了哪些"，即建分支 push 的完整范围），而非 fail-closed 全量。
#      两个事件（push + pull_request）对纯内容 PR 都正确 fast-pass。
#    - 不改为"push 只限 main"：实测改了 `on:` 触发器的 PR，GitHub 不再运行该 workflow
#      自身（自引用，PR #222 实证零 run），落该改动的操作成本/风险远高于收益；
#      all-zeros 回退已达成同样的快路径目标（见攻略 2.3）。

# 协议定义：docs-only = 仅改动 docs 清单内路径（含 site/ 产品 Web 层，见 detect-docs-only 的
# NON_DOCS 过滤）；workflow 自身改动不算 docs-only（跑全量）。
#
# 2026-08-25 pytest 优化（实测 47.8s/16核 vs 165.7s 串行，3.5x 提速，1238 passed 无 flaky）：
#   - 删除 xdist Timing Observation 步骤（BDD-15/M23 观测目的已达，continue-on-error 纯浪费 1m13s）
#   - 全量测试改 `-n auto`（xdist 并行）作为门禁；保留 --reruns 1（TAG0023 RM-AG0044 flaky 兜底）
#   - 风险：RM-AG0041(basetemp)/RM-AG0044(git 短 hash) 环境敏感测试在并发下的稳定性已实测验证

# 触发器：保持 [push, pull_request]。不改为"push 只限 main"——改了 on: 的 PR 不再运行该
# workflow 自身（自引用，见头部④）；建分支 push 的全零 before 已由 detect-docs-only 的
# all-zeros 回退兜底（见下方 detect 步骤与 docs/guides/ci-docs-only-playbook.md）。
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # docs-only 判定（取代原 paths-ignore）：计算本次变更是否纯 docs 清单内路径。
  # 输出 docs_only 供全量 job 的条件跳过使用；任何判定异常（空/非法 SHA、merge-base 失败）
  # 一律保守回退 docs_only=false（跑全量，fail-closed）。
  detect-docs-only:
    name: detect-docs-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect docs-only changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          docs_only=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"; HEAD="$PR_HEAD"
          elif [ "$EVENT_NAME" = "push" ]; then
            BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER"
            # 建分支的首次 push：github.event.before 为全零（GitHub 对新建分支的约定）→
            # merge-base 必失败 → 此前 fail-closed 回退 docs_only=false，连纯 docs/site 的
            # push run 也跑全量 pytest。回退修法：diff 对 origin/main（fetch-depth:0 全量
            # 克隆，origin/main 可用）——即"分支相对 main 改了哪些"，是建分支 push 的完整范围。
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              git fetch origin main 2>/dev/null || true
              BASE="origin/main"
            fi
          else
            BASE=""; HEAD=""
          fi
          if [ -n "$BASE" ] && [ -n "$HEAD" ] && [ "$BASE" != "$HEAD" ]; then
            MERGE_BASE=$(git merge-base "$BASE" "$HEAD" 2>/dev/null || true)
            if [ -n "$MERGE_BASE" ]; then
              CHANGED=$(git diff --name-only "$MERGE_BASE" "$HEAD" || true)
              # 纯 docs 判定：与历史 paths-ignore 清单一致（docs/roadmap/debt/archived/README/site 等）。
              # site/ 是产品 Web 层（VitePress 站点），在协议 gate 治理之外，改动等同 docs-only。
              # workflow 自身改动（.github/workflows/protocol-tests.yml 等）不在清单 → 视为非 docs-only。
              NON_DOCS=$(printf '%s\n' "$CHANGED" | grep -vE '^(agate-workspace/roadmap/|agate-workspace/debt/|archived/|docs/|site/|HANDOFF-[^/]*\.md$|FIX-[^/]*\.md$|README\.md$|README\.zh-CN\.md$|CHANGELOG\.md$|NOTICES\.md$|LICENSE$|\.github/workflows/docs-check\.yml$)' || true)
              if [ -z "$NON_DOCS" ] && [ -n "$CHANGED" ]; then
                docs_only=true
              fi
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  pytest:
    needs: detect-docs-only
    name: pytest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pyyaml pytest
      - name: Install pytest-rerunfailures + pytest-xdist (Linux, flaky 自动重跑 1 次 + 并行)
        if: runner.os == 'Linux'
        run: pip install pytest-rerunfailures pytest-xdist
      - name: Run Full Test Suite (Linux, 全量, xdist 并行)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ needs.detect-docs-only.outputs.docs_only }}" = "true" ]; then
            echo "docs-only PR: pytest skipped (fast-pass)"
            exit 0
          fi
          python3 -m pytest agate/tests/ --reruns 1 -n auto
        env:
          PYTHONIOENCODING: utf-8
      - name: Run Windows Smoke (marker 代表子集)
        if: runner.os == 'Windows'
        run: |
          if [ "${{ needs.detect-docs-only.outputs.docs_only }}" = "true" ]; then
            echo "docs-only PR: pytest skipped (fast-pass)"
            exit 0
          fi
          # TAG0011 决策：check-windows-smoke.sh 退役（v0.47.0，P1 §6.2），Windows 冒烟改由
          # @pytest.mark.windows_smoke marker 承接——平台敏感用例（cp1252/CRLF/symlink/py_path/
          # 复制模式/编码/无bc/ln 退化等）逐用例打标，代表集即清单。
          # 功能正确性由 Linux 全量 pytest 保证；Windows 只验证每条平台敏感机制代表用例跑通。
          python -m pytest agate/tests/ -m windows_smoke
        env:
          PYTHONIOENCODING: utf-8
      # DEBT0040 ③：账本/状态文件**事后**污染兜底（append-only 事件账本写入测试无 tmp 隔离强制）。
      # ⚠️ **必须放在本 job 内、全量测试之后**：GitHub Actions 每个 job 各有独立 runner 与独立
      #    checkout，放进 gate-backstop 等独立 job 只会看到全新干净工作树，**在结构上不可能**
      #    观测到 pytest 的副作用（那将只是「看起来有兜底」）。「位于 pytest job 内且在全量测试
      #    步骤之后」由 agate/tests/unit/test_t43_ledger_pollution_backstop.py 机械守护。
      # 成本：单次 `git status --porcelain`（pathspec 限定三个状态面），实测约 6ms——不新增 job，
      #    不新增 runner，故不增加 CI 墙钟时间（相对新增一个 job 可省约 20s 的 runner 启动）。
      - name: Ledger/state pollution backstop (DEBT0040)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ needs.detect-docs-only.outputs.docs_only }}" = "true" ]; then
            echo "docs-only PR: ledger pollution backstop skipped (fast-pass)"
            exit 0
          fi
          # fail-closed：exit 2（无法判定）同样判失败——不得把「没查」读成「查过了没问题」
          python3 agate/scripts/check-ledger-pollution.py .

  platform-scan:
    needs: detect-docs-only
    if: needs.detect-docs-only.outputs.docs_only == 'false'
    name: platform-scan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Run platform-assumptions scan (Linux, 阻断 gate)
        if: runner.os == 'Linux'
        run: python3 agate/scripts/check-platform-assumptions.py
      - name: Run platform-assumptions scan (Windows, 等价性证明)
        if: runner.os == 'Windows'
        env:
          PYTHONIOENCODING: utf-8
        run: python agate/scripts/check-platform-assumptions.py

  shellcheck:
    needs: detect-docs-only
    name: shellcheck
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y shellcheck
      - name: Install shellcheck (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -sSLo shellcheck.zip https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.zip
          unzip -q shellcheck.zip -d "$GITHUB_WORKSPACE/shellcheck"
          echo "$GITHUB_WORKSPACE/shellcheck" >> $GITHUB_PATH
      - name: Run shellcheck (Linux, 3 hook 薄壳)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ needs.detect-docs-only.outputs.docs_only }}" = "true" ]; then
            echo "docs-only PR: shellcheck skipped (fast-pass)"
            exit 0
          fi
          shellcheck -S warning agate/scripts/pre-commit-gate.sh agate/scripts/commit-msg-self-gate.sh agate/scripts/pre-push-gate.sh
      - name: Run shellcheck (Windows, 3 hook 薄壳)
        if: runner.os == 'Windows'
        run: |
          if [ "${{ needs.detect-docs-only.outputs.docs_only }}" = "true" ]; then
            echo "docs-only PR: shellcheck skipped (fast-pass)"
            exit 0
          fi
          shellcheck.exe -S warning agate/scripts/pre-commit-gate.sh agate/scripts/commit-msg-self-gate.sh agate/scripts/pre-push-gate.sh

  ruff:
    needs: detect-docs-only
    if: needs.detect-docs-only.outputs.docs_only == 'false'
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run ruff check (agate/, 项目根 pyproject.toml)
        # RM-AG0037: ruff 锁 0.16.4，与本地开发环境 ~/.venvs/agate-dev/bin/ruff 对齐（BDD-2 对齐语义实体化）
        run: pip install ruff==0.16.4 && ruff check agate/

  consistency:
    needs: detect-docs-only
    name: consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run consistency check (Linux)
        run: |
          if [ "${{ needs.detect-docs-only.outputs.docs_only }}" = "true" ]; then
            echo "docs-only PR: consistency skipped (fast-pass, docs-check.yml 已跑 --strict-errors-only)"
            exit 0
          fi
          python3 agate/scripts/check-protocol-consistency.py
      - name: Run structure consistency check (TAG0021 M2, Linux)
        run: |
          if [ "${{ needs.detect-docs-only.outputs.docs_only }}" = "true" ]; then
            echo "docs-only PR: structure consistency skipped (fast-pass)"
            exit 0
          fi
          python3 agate/scripts/check-structure-consistency.py

  gate-backstop:
    needs: detect-docs-only
    name: gate-backstop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run CI gate verify (Linux)
        # TAG0042 批 5（BDD-16 / M15）：本 job 由旧 CI 兜底脚本（5 个 SKIP 面与 PASS
        #   无法区分 = 假绿）改为 `agate-ci-verify.py`——它**实际重跑** gate 判定，
        #   且每个「跳过」面**显式**打印 `SKIP:` + 原因，与「通过」（`PASS:`）在输出上可区分。
        #   绿色 job 日志里的一行字几乎没人看 ⇒ 按 ADR-015 手段②把它抬到
        #   **GitHub 注解 + job summary**，让它在 PR 检查摘要里就看得见。
        #   ⚠️ 脚本本身**不依赖任何 CI 平台**（保持平台无关性）；平台耦合只在本 step。
        run: |
          set -o pipefail
          if [ "${{ needs.detect-docs-only.outputs.docs_only }}" = "true" ]; then
            echo "docs-only PR: gate-backstop skipped (fast-pass)"
            exit 0
          fi
          python3 agate/scripts/agate-ci-verify.py 2>&1 | tee /tmp/ci-verify.log
          if grep -q 'SKIP:' /tmp/ci-verify.log; then
            {
              echo "### ⚠️ gate-backstop 本次**跳过**（未实际执行 gate 兜底）"
              echo ""
              echo '```'
              grep -A 3 'SKIP:' /tmp/ci-verify.log | head -20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=gate-backstop 未生效::本次 gate 兜底未实际执行（输出含 SKIP: 与原因；exit 0 不代表通过）——详见 job summary"
          fi
