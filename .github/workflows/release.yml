name: Release

# v* tag 推送触发（tag-push backstop）；另提供 workflow_dispatch 人工授权入口
# （TAG0051 BDD-8：发布 = 独立流程 + 人工授权一次；发布不再只能由 tag push 被动触发）。
# 构建逻辑全在仓库脚本 agate/scripts/agate-release.py，本文件只做编排（不内联逻辑）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '待发布的 tag（须已存在，如 v0.82.0）'
        required: true
        type: string

permissions:
  contents: write
  checks: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # push：ref_name 即 tag；workflow_dispatch：取人工输入的 tag（唯一授权入口，见 on:）
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # 无第三方 action、无令牌；私有仓库时需另加 http.extraheader
      - name: Clone tag
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$TAG" -- "https://github.com/${GITHUB_REPOSITORY}.git" src

      # §6 根治（TAG0042 批0 评审）：tag ↔ 提交内声明的**指向校验**。
      # consistency 侧 CHECK 7 已改为 tag 无关（badge ↔ CHANGELOG）；「tag 指向何处」在这里补：
      #   · tag 名必须等于 tag 所指提交里 README badge 的版本；
      #   · 该提交的 CHANGELOG 里，这个版本节的正文不能为空。
      # 这两条现在就能拦住「tag 打到无关提交」（独立评审实测 HEAD~5 的场景：那里 badge 是旧版本）。
      - name: Verify tag points to matching commit
        working-directory: src
        run: |
          set -euo pipefail
          WANT="${TAG#v}"
          # 用 sed 抽取（不用 `grep | head | grep` 链）：后者在 README 无 badge 时首个 grep 退出 1，
          # 经 pipefail 会让赋值整体失败、**跳过下方友好错误提示**（评审 m-b 实测：no-badge 场景
          # stdout 为空、只剩 rc=1）。sed 无匹配只输出空串，交由下方 -z 判定给明确 ::error::。
          BADGE="$(sed -n 's#.*badge/version-v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*#\1#p' README.md | head -1)"
          if [ -z "$BADGE" ]; then
            echo "::error::tag 所指提交的 README.md 未找到 version badge"
            exit 1
          fi
          if [ "$BADGE" != "$WANT" ]; then
            echo "::error::tag $TAG 指向的提交 README badge 是 v$BADGE（应等于 tag 版本 v$WANT）——tag 打错位置？"
            exit 1
          fi
          # CHANGELOG 该版本节正文非空（标题行与下一个 ## 之间须有非空内容）
          python3 - "$WANT" <<'PY'
          import re, sys
          want = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(want)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text,
                        re.MULTILINE | re.DOTALL)
          if not m:
              print(f"::error::CHANGELOG.md 无 [{want}] 版本节")
              sys.exit(1)
          body = re.sub(r"^###.*$", "", m.group(1), flags=re.MULTILINE).strip()
          if not body:
              print(f"::error::CHANGELOG.md [{want}] 版本节正文为空")
              sys.exit(1)
          print(f"OK: tag {want} ↔ README badge 一致，CHANGELOG 版本节非空")
          PY

      - name: Python deps (pinned pyyaml)
        working-directory: src
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          PIN="$(python3 -B agate/scripts/agate-release.py pyyaml-pin)"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --only-binary=:all: "pyyaml==${PIN}"

      # 发布门 backstop（TAG0051 M12 / BDD-9/10/12）：tag-push 路径的 fail-closed 兜底——
      # 目标提交 required 检查**无已完成结论**（missing/queued/in_progress）或已完成结论含非 success
      # ⇒ 中止，不建 Release；同一 SHA 上因 tag push 并发重跑的新 run **不**致假失败（按名归组只看
      # 已完成结论，DEBT0074）。consistency 报 ERROR 同样中止。
      # 只**调用**仓库脚本 `agate-release.py gate`，workflow 内不内联门逻辑。
      #
      # ⚠️ SEC-03（required 集合漂移）：下列 AGATE_RELEASE_REQUIRED_CHECKS 是**硬编码**的 required
      #    contexts 列表，与仓库**分支保护**是两份数据，可能漂移——**分支保护每新增一项 required，
      #   必须同步增补到本列表**（否则门不校验该项 = 保护更强、门更弱）。改名/删除同理。
      #   为何硬编码：Actions 的 GITHUB_TOKEN 无 admin 权限、读不到 branch protection。
      #
      # ⚠️ SEC-07（RM-AG0043 反查落点）：本步**未传 `--task`** ⇒ `check-gate.py P8` 的 roadmap RM
      #   `done` 反查**在此 CI backstop 不生效**（该反查仅在本地 runbook 门、即带 `--task` 时执行）。
      #   这是有意的：CI 内无「待发布任务目录」的稳定语义，不硬塞语义不明的 task id。
      #   完整口径以本地发布门（`agate-release.py gate --task <TASK_DIR>`）为准。
      - name: Release gate (fail-closed backstop)
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          AGATE_RELEASE_REQUIRED_CHECKS: "shellcheck (ubuntu-latest),shellcheck (windows-latest),pytest (ubuntu-latest),pytest (windows-latest),consistency,gate-backstop"
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python" -B agate/scripts/agate-release.py gate --sha "$GITHUB_SHA"

      # 只调用仓库脚本；workflow 内零打包逻辑；本步骤不持有令牌
      - name: Build assets
        working-directory: src
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python" -B agate/scripts/agate-release.py build \
            --tag "$TAG" --expect-sha "$GITHUB_SHA" --repo . \
            --outdir "$RUNNER_TEMP/dist" --notes-out "$RUNNER_TEMP/notes.md"

      - name: Publish
        working-directory: src
        env:
          # 仅此步骤持有内置令牌
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rc=0; python3 -B agate/scripts/agate-release.py is-prerelease "$TAG" || rc=$?
          PRE=()
          case "$rc" in 0) PRE=(--prerelease);; 1) ;; *) exit "$rc";; esac
          gh release create "$TAG" "$RUNNER_TEMP"/dist/* --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" "${PRE[@]}"
