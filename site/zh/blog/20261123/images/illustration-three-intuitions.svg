<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Georgia, 'Times New Roman', serif">
  <rect width="900" height="520" fill="#FAF9F4"/>
  <text x="450" y="50" font-size="27" font-weight="700" fill="#1A1A18" text-anchor="middle" font-family="Noto Sans SC, serif">三条直觉，三次测量</text>
  <text x="450" y="79" font-size="16" font-style="italic" fill="#444441" text-anchor="middle" font-family="Noto Sans SC, serif">每条直觉都点到一个真实成本——错在跳过它的占比</text>

  <g font-family="Noto Sans SC, sans-serif">
    <line x1="40" y1="104" x2="860" y2="104" stroke="#1A1A18" stroke-width="2"/>
    <text x="52" y="128" font-size="14" font-weight="700" fill="#085041" letter-spacing="1.4">直觉</text>
    <text x="300" y="128" font-size="14" font-weight="700" fill="#085041" letter-spacing="1.4">实测</text>
    <text x="662" y="128" font-size="14" font-weight="700" fill="#085041" letter-spacing="1.4">判定</text>
    <line x1="40" y1="140" x2="860" y2="140" stroke="#D8D5CB" stroke-width="2"/>

    <text x="52" y="180" font-size="15" font-weight="700" fill="#1A1A18">"上下文</text>
    <text x="52" y="200" font-size="15" font-weight="700" fill="#1A1A18">是瓶颈"</text>
    <text x="300" y="180" font-size="15.5" fill="#444441">会话内上下文 ×9.6</text>
    <text x="300" y="200" font-size="15.5" fill="#444441">步耗时持平，r = −0.03</text>
    <text x="662" y="190" font-size="14" font-weight="700" fill="#D85A30">不是提速杠杆</text>
    <line x1="40" y1="218" x2="860" y2="218" stroke="#D8D5CB" stroke-width="1.5" stroke-dasharray="4,4"/>

    <text x="52" y="258" font-size="15" font-weight="700" fill="#1A1A18">"工具</text>
    <text x="52" y="278" font-size="15" font-weight="700" fill="#1A1A18">是瓶颈"</text>
    <text x="300" y="258" font-size="15.5" fill="#444441">占周期 23.7%（pooled）</text>
    <text x="300" y="278" font-size="15.5" fill="#444441">2.1%（中位）</text>
    <text x="662" y="268" font-size="14" font-weight="700" fill="#D85A30">最多四分之一</text>
    <line x1="40" y1="296" x2="860" y2="296" stroke="#D8D5CB" stroke-width="1.5" stroke-dasharray="4,4"/>

    <text x="52" y="336" font-size="15" font-weight="700" fill="#1A1A18">"大任务</text>
    <text x="52" y="356" font-size="15" font-weight="700" fill="#1A1A18">派发更多"</text>
    <text x="300" y="336" font-size="15.5" fill="#444441">规模跨约 100 倍</text>
    <text x="300" y="356" font-size="15.5" fill="#444441">派发只跨 2.7 倍；r = 0.48</text>
    <text x="662" y="346" font-size="14" font-weight="700" fill="#D85A30">弱相关，非成比例</text>
    <line x1="40" y1="374" x2="860" y2="374" stroke="#1A1A18" stroke-width="2"/>
  </g>

  <g font-family="Noto Sans SC, sans-serif">
    <rect x="40" y="396" width="820" height="76" rx="10" fill="#E3E0F7" stroke="#4C45A8" stroke-width="2.5"/>
    <text x="64" y="424" font-size="13" font-weight="700" fill="#4C45A8" letter-spacing="1.5">规则</text>
    <text x="64" y="450" font-size="15" fill="#1A1A18">优化一项之前，先量它占总时间的比例。低于几个百分点，那是爱好；</text>
    <text x="64" y="468" font-size="15" fill="#1A1A18">高于三分之一，那才是正事。</text>
  </g>

  <text x="450" y="504" font-size="14" font-style="italic" fill="#444441" text-anchor="middle" font-family="Noto Sans SC, serif">每条直觉都在断言成本存在；决策需要的是它占多少。</text>
</svg>
