<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="aCoral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#712B13"/>
    </marker>
    <marker id="aTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#157A59"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#FAF9F4"/>

  <text x="70" y="86" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" letter-spacing="3.5" fill="#1D9E75" font-weight="600">AGATEON — ORCHESTRATION PROTOCOL</text>

  <text x="70" y="200" font-size="64" font-weight="700" fill="#1A1A18" font-family="Noto Sans SC, serif">没有 agent 能</text>
  <text x="70" y="278" font-size="64" font-weight="700" fill="#1D9E75" font-family="Noto Sans SC, serif">给自己的作业打分</text>
  <text x="70" y="330" font-size="23" font-style="italic" fill="#444441" font-family="Noto Sans SC, serif">评审需要的是另一个上下文，不是更好的提示词</text>

  <g>
    <circle cx="160" cy="416" r="44" fill="#E3E0F7" stroke="#4C45A8" stroke-width="3"/>
    <circle cx="160" cy="402" r="13" fill="#4C45A8"/>
    <path d="M 134 440 Q 160 460 186 440" fill="none" stroke="#4C45A8" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="160" y="492" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#4C45A8" text-anchor="middle" letter-spacing="2">作者</text>

  <g>
    <rect x="248" y="386" width="84" height="60" rx="6" fill="#FAF9F4" stroke="#1A1A18" stroke-width="3"/>
    <line x1="262" y1="406" x2="318" y2="406" stroke="#1A1A18" stroke-width="3"/>
    <line x1="262" y1="422" x2="310" y2="422" stroke="#1A1A18" stroke-width="3"/>
  </g>

  <path d="M 336 416 L 448 416" fill="none" stroke="#712B13" stroke-width="5" marker-end="url(#aCoral)"/>

  <line x1="484" y1="342" x2="484" y2="500" stroke="#D85A30" stroke-width="3.5" stroke-dasharray="9,7"/>
  <text x="484" y="526" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#D85A30" text-anchor="middle" letter-spacing="2.5">上下文墙</text>

  <g>
    <rect x="516" y="398" width="64" height="36" rx="4" fill="#FAF9F4" stroke="#085041" stroke-width="2.5"/>
    <path d="M 516 402 L 548 422 L 580 402" fill="none" stroke="#085041" stroke-width="2.5"/>
  </g>
  <path d="M 592 416 L 672 416" fill="none" stroke="#157A59" stroke-width="5" marker-end="url(#aTeal)"/>
  <text x="548" y="462" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#085041" text-anchor="middle">产出 + 规范</text>

  <g>
    <circle cx="736" cy="416" r="44" fill="#FAF9F4" stroke="#1D9E75" stroke-width="4"/>
    <text x="736" y="432" fill="#0E8A72" font-family="'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="700" text-anchor="middle">✓</text>
  </g>
  <text x="736" y="492" font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#085041" text-anchor="middle" letter-spacing="2">JUDGE</text>

  <g>
    <rect x="806" y="392" width="96" height="48" rx="8" fill="#085041"/>
    <text x="854" y="423" fill="#FAF9F4" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">exit 0</text>
  </g>

  <text x="70" y="612" font-size="18" font-style="italic" fill="#444441" font-family="Noto Sans SC, serif">评审从作者上下文结束的地方开始。</text>
</svg>
