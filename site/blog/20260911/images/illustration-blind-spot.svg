<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="aCoralL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#712B13"/>
    </marker>
    <marker id="aTealL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#157A59"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#FAF9F4"/>

  <text x="450" y="56" font-size="28" font-weight="700" fill="#1A1A18" text-anchor="middle">Where the blind spot lives</text>
  <text x="450" y="88" font-size="17" font-style="italic" fill="#444441" text-anchor="middle">a fresh session changes the context — the weights come along</text>

  <!-- ===== left: same model ===== -->
  <g>
    <rect x="40" y="120" width="390" height="320" rx="12" fill="#FAF9F4" stroke="#712B13" stroke-width="3"/>
    <text x="235" y="158" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#712B13" text-anchor="middle">1 · SAME MODEL, NEW SESSION</text>
    <!-- author -->
    <circle cx="150" cy="250" r="36" fill="#E3E0F7" stroke="#4C45A8" stroke-width="3"/>
    <text x="150" y="260" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" text-anchor="middle">✎</text>
    <text x="150" y="316" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#4C45A8" text-anchor="middle" letter-spacing="2">AUTHOR</text>
    <!-- wall -->
    <line x1="222" y1="190" x2="222" y2="330" stroke="#D85A30" stroke-width="3" stroke-dasharray="7,5"/>
    <!-- reviewer same color -->
    <circle cx="300" cy="250" r="36" fill="#E3E0F7" stroke="#4C45A8" stroke-width="3"/>
    <text x="300" y="260" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#4C45A8" text-anchor="middle">✓</text>
    <text x="300" y="316" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#4C45A8" text-anchor="middle" letter-spacing="2">REVIEWER</text>
    <!-- shared blind spot: dotted ellipse spanning both, below -->
    <ellipse cx="225" cy="368" rx="150" ry="26" fill="none" stroke="#D85A30" stroke-width="2.5" stroke-dasharray="5,5"/>
    <text x="225" y="374" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#D85A30" text-anchor="middle">same blind spot, missed twice</text>
    <text x="235" y="424" font-size="17" font-weight="700" fill="#D85A30" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif">the echo passed the review</text>
  </g>

  <!-- ===== right: different lineage ===== -->
  <g>
    <rect x="470" y="120" width="390" height="320" rx="12" fill="#FAF9F4" stroke="#085041" stroke-width="3"/>
    <text x="665" y="158" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#085041" text-anchor="middle">2 · DIFFERENT MODEL, NEW SESSION</text>
    <circle cx="568" cy="250" r="36" fill="#E3E0F7" stroke="#4C45A8" stroke-width="3"/>
    <text x="568" y="260" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" text-anchor="middle">✎</text>
    <text x="568" y="316" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#4C45A8" text-anchor="middle" letter-spacing="2">AUTHOR</text>
    <line x1="640" y1="190" x2="640" y2="330" stroke="#D85A30" stroke-width="3" stroke-dasharray="7,5"/>
    <!-- reviewer different color -->
    <circle cx="722" cy="250" r="36" fill="#FAF9F4" stroke="#1D9E75" stroke-width="3.5"/>
    <text x="722" y="260" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#0E8A72" text-anchor="middle">✓</text>
    <text x="722" y="316" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#085041" text-anchor="middle" letter-spacing="2">JUDGE</text>
    <!-- blind spot only under author; judge probes it -->
    <ellipse cx="568" cy="368" rx="86" ry="26" fill="none" stroke="#D85A30" stroke-width="2.5" stroke-dasharray="5,5"/>
    <text x="568" y="374" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#D85A30" text-anchor="middle">blind spot stays local</text>
    <text x="665" y="424" font-size="17" font-weight="700" fill="#085041" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif">verdict + exit code</text>
  </g>

  <text x="450" y="482" font-size="15" font-style="italic" fill="#444441" text-anchor="middle">same artifact. different lineage. different questions.</text>
</svg>
