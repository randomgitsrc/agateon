<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Georgia, 'Times New Roman', serif">
  <rect width="900" height="520" fill="#FAF9F4"/>

  <text x="450" y="50" font-size="27" font-weight="700" fill="#1A1A18" text-anchor="middle">Three intuitions, three measurements</text>
  <text x="450" y="79" font-size="16" font-style="italic" fill="#444441" text-anchor="middle">each intuition names a real cost — the error is skipping its share</text>

  <g font-family="'Helvetica Neue', Arial, sans-serif">
    <!-- 表头 -->
    <line x1="40" y1="104" x2="860" y2="104" stroke="#1A1A18" stroke-width="2"/>
    <text x="52" y="128" font-size="14" font-weight="700" fill="#085041" letter-spacing="1.4">INTUITION</text>
    <text x="330" y="128" font-size="14" font-weight="700" fill="#085041" letter-spacing="1.4">WHAT WE MEASURED</text>
    <text x="690" y="128" font-size="14" font-weight="700" fill="#085041" letter-spacing="1.4">VERDICT</text>
    <line x1="40" y1="140" x2="860" y2="140" stroke="#D8D5CB" stroke-width="2"/>

    <!-- 行 1 -->
    <text x="52" y="180" font-size="15" font-weight="700" fill="#1A1A18">"context is</text>
    <text x="52" y="200" font-size="15" font-weight="700" fill="#1A1A18">the bottleneck"</text>
    <text x="330" y="180" font-size="15.5" fill="#444441">context ×9.6 over a session;</text>
    <text x="330" y="200" font-size="15.5" fill="#444441">step duration flat, r = −0.03</text>
    <text x="690" y="190" font-size="14" font-weight="700" fill="#D85A30">not the speed lever</text>
    <line x1="40" y1="218" x2="860" y2="218" stroke="#D8D5CB" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- 行 2 -->
    <text x="52" y="258" font-size="15" font-weight="700" fill="#1A1A18">"tools are</text>
    <text x="52" y="278" font-size="15" font-weight="700" fill="#1A1A18">the bottleneck"</text>
    <text x="330" y="258" font-size="15.5" fill="#444441">32.7% pooled,</text>
    <text x="330" y="278" font-size="15.5" fill="#444441">2.1% median</text>
    <text x="690" y="268" font-size="14" font-weight="700" fill="#D85A30">a third at most</text>
    <line x1="40" y1="296" x2="860" y2="296" stroke="#D8D5CB" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- 行 3 -->
    <text x="52" y="336" font-size="15" font-weight="700" fill="#1A1A18">"bigger tasks</text>
    <text x="52" y="356" font-size="15" font-weight="700" fill="#1A1A18">mean more dispatch"</text>
    <text x="330" y="336" font-size="15.5" fill="#444441">size spans ~100x, dispatch</text>
    <text x="330" y="356" font-size="15.5" fill="#444441">spans 2.7x; r = 0.48</text>
    <text x="656" y="338" font-size="14" font-weight="700" fill="#D85A30">weakly, not</text>
    <text x="656" y="356" font-size="14" font-weight="700" fill="#D85A30">proportionally</text>
    <line x1="40" y1="374" x2="860" y2="374" stroke="#1A1A18" stroke-width="2"/>
  </g>

  <!-- 底部：规则 -->
  <g font-family="'Helvetica Neue', Arial, sans-serif">
    <rect x="40" y="396" width="820" height="76" rx="10" fill="#E3E0F7" stroke="#4C45A8" stroke-width="2.5"/>
    <text x="64" y="424" font-size="13" font-weight="700" fill="#4C45A8" letter-spacing="1.5">THE RULE</text>
    <text x="64" y="450" font-size="15" fill="#1A1A18">Measure an item's share of total time first. Below a few percent it's a hobby;</text>
    <text x="64" y="468" font-size="15" fill="#1A1A18">above a third it's the job.</text>
  </g>

  <text x="450" y="504" font-size="14" font-style="italic" fill="#444441" text-anchor="middle">Each intuition is a claim about a cost existing. The decision needs a claim about its share.</text>
</svg>
